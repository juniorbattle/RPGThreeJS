<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Option C Phase 4A — DEV surface composite</title>
  <style>
    :root { color-scheme: dark; --gold:#c6a66a; --pale:#f1e6cc; --ink:#071019; --blue:#59b9ff; --red:#d74b4b; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#02070c; color:var(--pale); font-family:Georgia,"Times New Roman",serif; }
    .surface { position:relative; width:100vw; height:100vh; overflow:hidden; isolation:isolate; background:#02070c; }
    .surface::before { content:""; position:absolute; inset:0; z-index:-2; background-image:var(--background); background-position:center; background-size:cover; filter:saturate(.92) contrast(1.04); }
    .surface::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg,rgba(2,7,12,.2),transparent 38%,rgba(2,7,12,.25)),radial-gradient(circle at center,transparent 44%,rgba(2,7,12,.45)); pointer-events:none; }
    .gold-frame { position:absolute; inset:1.2%; border:1px solid rgba(198,166,106,.72); box-shadow:inset 0 0 0 1px rgba(4,9,14,.85); pointer-events:none; }
    .gold-frame::before,.gold-frame::after { content:"◆"; position:absolute; top:-.72rem; color:var(--gold); font-size:1rem; }
    .gold-frame::before { left:-.34rem; }.gold-frame::after { right:-.34rem; }
    .panel { border:1px solid rgba(198,166,106,.72); background:linear-gradient(145deg,rgba(5,13,22,.96),rgba(8,17,27,.91)); box-shadow:0 12px 28px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.04); }
    .smallcaps { text-transform:uppercase; letter-spacing:.16em; }
    .serif-title { color:var(--pale); text-transform:uppercase; letter-spacing:.10em; text-shadow:0 2px 5px #000; }
    .dev { position:absolute; left:2.1%; bottom:1.7%; z-index:20; color:rgba(241,230,204,.66); font:600 10px/1.2 system-ui,sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    .character { position:absolute; object-fit:contain; object-position:center bottom; filter:drop-shadow(0 12px 9px rgba(0,0,0,.56)); }
    button { appearance:none; color:var(--pale); border:1px solid rgba(198,166,106,.62); background:rgba(10,24,38,.86); padding:.72em 1.2em; font:600 12px/1 Georgia,serif; letter-spacing:.14em; text-transform:uppercase; }

    .travel { --background:url('../environment/forest-road-travel-dev.png'); }
    .travel .menu { position:absolute; right:3.2%; top:3.3%; display:flex; gap:1.7rem; padding:.72rem 1.3rem; font-size:clamp(9px,.68vw,13px); }
    .travel .next { position:absolute; right:4.1%; bottom:5.2%; width:min(31vw,520px); padding:1.1rem 1.25rem 1rem; }
    .travel .eyebrow { color:#87b9d6; font:700 clamp(9px,.65vw,12px)/1.2 system-ui,sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    .travel h1 { margin:.2rem 0 .45rem; font-size:clamp(22px,1.72vw,34px); }
    .travel p { margin:.15rem 0; font:clamp(11px,.78vw,15px)/1.45 system-ui,sans-serif; color:#c7d0d9; }
    .travel button { width:100%; margin-top:.9rem; }
    .travel .caption { position:absolute; left:4%; bottom:6.1%; max-width:32%; font:italic clamp(14px,1.1vw,22px)/1.4 Georgia,serif; color:#eadbbc; text-shadow:0 2px 6px #000; }

    .tableau { --background:url('../environment/forest-road-tableau-dev.png'); }
    .tableau .speaker { left:7.5%; bottom:-2.5%; height:75%; max-width:37%; }
    .tableau .dialogue { position:absolute; left:31%; top:4.6%; width:54%; min-height:20%; padding:1.2rem 1.5rem 1rem; }
    .tableau .dialogue h1 { margin:0; font-size:clamp(21px,1.55vw,31px); }
    .tableau .dialogue h2 { margin:.2rem 0 .75rem; color:var(--gold); font:700 clamp(9px,.62vw,12px)/1 system-ui,sans-serif; letter-spacing:.18em; text-transform:uppercase; }
    .tableau .dialogue p { margin:0; max-width:92%; font:clamp(14px,1.03vw,20px)/1.5 system-ui,sans-serif; color:#f0f2f2; }
    .tableau .continue { position:absolute; right:1.1rem; bottom:.8rem; color:var(--gold); font:700 clamp(9px,.62vw,12px)/1 system-ui,sans-serif; letter-spacing:.15em; text-transform:uppercase; }
    .tableau .speaker-name { position:absolute; left:13%; bottom:4%; font-size:clamp(17px,1.3vw,26px); }

    .strategic { --background:url('../environment/forest-road-strategic-dev.png'); }
    .strategic::after { background:linear-gradient(180deg,rgba(2,7,12,.25),transparent 22%,transparent 74%,rgba(2,7,12,.44)),radial-gradient(circle at center,transparent 38%,rgba(2,7,12,.48)); }
    .strategic .turn { position:absolute; left:21%; top:2.2%; width:57%; height:8.4%; display:flex; align-items:center; justify-content:center; gap:clamp(10px,1.5vw,28px); padding:.55rem 1rem; }
    .turn .round { padding-right:1.4rem; border-right:1px solid rgba(198,166,106,.44); text-align:center; font-size:clamp(11px,.9vw,17px); }
    .turn .token { width:clamp(28px,2.5vw,48px); aspect-ratio:1; border-radius:50%; border:1px solid rgba(198,166,106,.7); background:rgba(13,24,30,.8); display:grid; place-items:center; font:700 clamp(10px,.72vw,14px)/1 system-ui,sans-serif; }
    .strategic .unit-panel { position:absolute; left:2.1%; bottom:5.1%; width:16.2%; padding:1rem; }
    .unit-panel h1 { margin:.1rem 0 .65rem; font-size:clamp(17px,1.25vw,25px); }
    .unit-panel p { margin:.25rem 0; font:clamp(10px,.69vw,13px)/1.45 system-ui,sans-serif; color:#cbd5dc; }
    .hp { width:100%; height:10px; border:1px solid #10202a; background:#071018; margin:.4rem 0 .8rem; }
    .hp span { display:block; width:100%; height:100%; background:linear-gradient(90deg,#5dbd72,#c8ef8b); }
    .strategic .actions { position:absolute; left:28%; bottom:2.7%; width:48%; height:12%; display:flex; align-items:stretch; justify-content:center; gap:.55rem; padding:.55rem; }
    .actions button { flex:1 1 0; padding:.55rem .25rem; font-size:clamp(8px,.62vw,12px); }
    .strategic .objectives { position:absolute; right:2.1%; top:12.2%; width:14.5%; padding:.75rem; font:700 clamp(8px,.62vw,12px)/1.5 system-ui,sans-serif; }
    .strategic .kestrel { left:37%; bottom:25%; height:22%; }
    .strategic .enemy { right:27%; bottom:30%; height:15%; }
    .ring { position:absolute; border:clamp(2px,.22vw,4px) solid; border-radius:50%; height:3.1%; transform:perspective(80px) rotateX(65deg); box-shadow:0 0 8px currentColor; }
    .ring.hero { color:var(--blue); left:39.4%; bottom:25.3%; width:6.4%; }
    .ring.foe { color:var(--red); right:28.1%; bottom:30.3%; width:6%; }

    .stage { --background:url('../environment/forest-road-combat-stage-dev.png'); }
    .stage::after { background:linear-gradient(90deg,rgba(2,7,12,.28),transparent 28%,transparent 70%,rgba(2,7,12,.28)),linear-gradient(180deg,rgba(2,7,12,.19),transparent 52%,rgba(2,7,12,.35)); }
    .stage .attack-card { position:absolute; left:36%; top:4.2%; width:28%; padding:.75rem 1rem; text-align:center; }
    .attack-card h1 { margin:0; font-size:clamp(20px,1.55vw,30px); }
    .attack-card p { margin:.3rem 0 0; font:clamp(10px,.72vw,14px)/1.2 system-ui,sans-serif; color:#ced7db; }
    .stage .kestrel { left:5.5%; bottom:3.5%; height:67%; width:44%; }
    .stage .enemy { right:10%; bottom:9%; height:38%; width:30%; }
    .stage .damage { position:absolute; right:18%; bottom:45%; font:700 clamp(25px,2.1vw,42px)/1 Georgia,serif; text-shadow:0 3px 7px #000; }
    .stage .phase { position:absolute; right:3%; bottom:3.4%; padding:.65rem 1.05rem; font:600 clamp(8px,.6vw,12px)/1 system-ui,sans-serif; letter-spacing:.12em; text-transform:uppercase; }
  </style>
</head>
<body>
  <main id="root"></main>
  <script>
    const root = document.querySelector('#root');
    const surface = new URLSearchParams(location.search).get('surface') || 'travel';
    const common = '<div class="gold-frame"></div><div class="dev">DEV · OPTION C · PHASE 4A · NO PRODUCTION USE</div>';
    const pages = {
      travel: `<section class="surface travel" data-surface="travel">${common}<nav class="menu panel smallcaps" data-ui><span>Campagne</span><span>Sauvegarder</span><span>Menu</span></nav><blockquote class="caption">« La forêt garde ses secrets, mais la route est claire. »</blockquote><aside class="next panel" data-ui><div class="eyebrow">Prochaine étape</div><h1 class="serif-title">Piste des bêtes</h1><p>Combat · Standard</p><p>Depuis · Audience d’Alaric</p><button>Continuer ›</button></aside></section>`,
      tableau: `<section class="surface tableau" data-surface="tableau">${common}<img class="character speaker" src="../characters/poses/idle/kestrel-idle-1.png" alt="Kestrel"><article class="dialogue panel" data-ui><h1 class="serif-title">Kestrel</h1><h2>Première piste</h2><p>À peine sortis du camp, les traces se multiplient : sabots affolés, griffes, branches brisées. Les Serpents ont chassé les bêtes vers la route pour nous ralentir.</p><span class="continue">Continuer ◆</span></article><div class="speaker-name serif-title">Kestrel</div></section>`,
      strategic: `<section class="surface strategic" data-surface="strategic">${common}<header class="turn panel" data-ui><div class="round smallcaps">Tour<br><strong>1 / 7</strong></div><div class="token">K</div><div class="token">A</div><div class="token">S</div><div class="token">E</div><div class="token">B</div><div class="token">M</div></header><aside class="unit-panel panel" data-ui><div class="smallcaps">Archer · Allié</div><h1 class="serif-title">Kestrel</h1><p>PV <strong>90 / 90</strong></p><div class="hp"><span></span></div><p><strong>Tir de Précision</strong><br>+5% de précision à portée maximale.</p></aside><aside class="objectives panel smallcaps" data-ui>Objectif&nbsp;&nbsp; 0/3<br>Journal&nbsp;&nbsp;&nbsp; 2</aside><div class="actions panel" data-ui><button>Déplacer<br>3 PM</button><button>Attaque<br>1 PA</button><button>Compétence<br>1 PA</button><button>Objet<br>Sac</button><button>Attendre<br>Fin</button></div><div class="ring hero"></div><img class="character kestrel" src="../characters/poses/idle/kestrel-idle-1.png" alt="Kestrel"><div class="ring foe"></div><img class="character enemy" src="../../../../../public/assets/characters/pixel/full/forest_badger.png" alt="Blaireau"></section>`,
      stage: `<section class="surface stage" data-surface="stage">${common}<header class="attack-card panel" data-ui><h1 class="serif-title">Attaque</h1><p>Kestrel → Blaireau · Tir de Précision</p></header><img class="character kestrel" src="../characters/poses/attack/kestrel-attack-1.png" alt="Kestrel attaque"><img class="character enemy" src="../../../../../public/assets/characters/pixel/full/forest_badger.png" alt="Blaireau"><div class="damage">−17</div><div class="phase panel" data-ui>Résolution de combat</div></section>`
    };
    root.innerHTML = pages[surface] || pages.travel;
  </script>
</body>
</html>
